# Publishes @feinarbyte/file-merge to npm when a version tag is pushed.
# Uses npm trusted publishing (OIDC): no npm token is stored in GitHub.
# The package's npm settings must list this repo + workflow file as trusted publisher.
name: Publish

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"

permissions:
  contents: read
  id-token: write # required for trusted publishing (and provenance)

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      # Trusted publishing needs npm >= 11.5.1
      - run: npm install -g npm@latest
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
      # npm (not pnpm) performs the OIDC exchange; provenance is attached automatically
      - run: npm publish --access public
