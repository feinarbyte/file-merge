# Stages @feinarbyte/file-merge on npm when a version tag is pushed.
# Uses npm trusted publishing (OIDC): no npm token is stored in GitHub.
# The trusted publisher on npmjs.com allows only "npm stage publish" (not "npm publish"),
# so a maintainer must approve each staged version with 2FA before it goes live:
#   npm stage list @feinarbyte/file-merge
#   npm stage approve <stage-id>
name: Publish

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"

permissions:
  contents: read
  id-token: write # required for trusted publishing (and provenance)

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      # Staged publishing via trusted publishing needs a current npm
      - run: npm install -g npm@^12
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
      # npm (not pnpm) performs the OIDC exchange; provenance is attached automatically.
      # Runs prepublishOnly (build) like npm publish, but only stages the version.
      - run: npm stage publish --access public
